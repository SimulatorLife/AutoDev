# Phase 3 pinned OpenTelemetry Collector runtime configuration.
#
# This configuration is validated by tests/test_otel_collector_config.py and
# installed/launched only when Collector mode is explicitly enabled. It pins the
# an OTLP HTTP ingress on 127.0.0.1:4318 that forwards logs, traces, and
# metrics to the existing AutoDev OTLP receiver at http://127.0.0.1:4100
# using JSON encoding, because that receiver parses OTLP JSON and does not
# accept the Collector exporter's protobuf default.
#
# No generic backend exporter or multi-exporter tee is part of this slice.
# See docs/AUTODEV_PLATFORM_MIGRATION.md ("Phase 3 — Insert OpenTelemetry
# Collector as OTLP ingress") for the runtime and rollback procedure.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  otlp_http/autodev:
    endpoint: http://127.0.0.1:4100
    encoding: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_http/autodev]
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/autodev]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/autodev]
