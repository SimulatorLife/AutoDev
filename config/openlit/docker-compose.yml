# Local OpenLIT deployment for AutoDev.
#
# This file is a *subset* of the upstream docker-compose.yml. It is the
# minimal manifest that brings up ClickHouse + the pinned OpenLIT image and
# exposes the first-party OTLP receivers (:4317 gRPC, :4318 HTTP) so
# producers can send standard OTLP directly.
#
# Notable differences from upstream:
#   - NO additional sidecar Collector. OpenLIT 2.1.0 ships its own OTLP
#     receiver; a sidecar would be a parallel pass-through and is excluded
#     from the target (see docs/autodev-console-target-state.md §8).
#   - Image is pinned by digest. Set OPENLIT_IMAGE in openlit.env to pin a
#     different build (e.g. one that has the AutoDev patches baked in).
#     The `scripts/openlit/up.sh` runner overrides OPENLIT_IMAGE with the
#     locally-built patched tag (autodev-openlit:<commit>-p<patch-set>).
#   - The patched UI is what producers hit when they navigate to PORT;
#     OTLP ingestion happens over :4318 regardless.
#   - DB password and AutoDev control API token MUST be strong; the
#     `scripts/openlit/bootstrap-secrets.sh` runner rotates the weak
#     `openlit` / `replace-me` defaults before compose ever starts, and
#     `scripts/openlit/up.sh` refuses to start the stack if either value
#     remains weak.
#   - OpenLIT 2.1.0 has no OTLP auth environment toggle. The local patch
#     binds the contrib bearer-token authenticator to HTTP and gRPC; the
#     matching token is generated before startup and kept outside the repo.
#   - The upstream image/source is pinned via OPENLIT_IMAGE / OPENLIT_TAG
#     in `config/openlit/openlit.env`.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-clickhouse
    labels:
      io.autodev.openlit.clickhouse-config-sha256: ${AUTODEV_OPENLIT_CLICKHOUSE_CONFIG_HASH:?computed by scripts/openlit/up.sh}
    environment:
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:?OPENLIT_DB_PASSWORD must be set; run scripts/openlit/up.sh to bootstrap strong secrets}
      CLICKHOUSE_USER: ${OPENLIT_DB_USER:-default}
      CLICKHOUSE_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
    volumes:
      - openlit-clickhouse:/var/lib/clickhouse
      - ./assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s
    restart: unless-stopped

  openlit:
    image: ${OPENLIT_IMAGE:-autodev-openlit:openlit-9938c6663866-patched}
    container_name: openlit
    labels:
      io.autodev.openlit.collector-config-sha256: ${AUTODEV_OPENLIT_OTEL_CONFIG_HASH:?computed by scripts/openlit/up.sh}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEMETRY_ENABLED: "true"
      INIT_DB_HOST: clickhouse
      INIT_DB_PORT: 8123
      INIT_DB_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      INIT_DB_USERNAME: ${OPENLIT_DB_USER:-default}
      INIT_DB_PASSWORD: ${OPENLIT_DB_PASSWORD:?OPENLIT_DB_PASSWORD must be set; run scripts/openlit/up.sh to bootstrap strong secrets}
      PORT: ${PORT:-3000}
      DOCKER_PORT: ${PORT:-3000}
      # The pinned client Prisma schema requires this setting at startup.
      # Its database directory is covered by the durable openlit-data volume.
      SQLITE_DATABASE_URL: file:/app/client/data/data.db

      # The local patch binds this token to the embedded Collector receiver.
      OPENLIT_OTLP_API_KEY: ${OPENLIT_OTLP_API_KEY:?OPENLIT_OTLP_API_KEY must be set in CODEX_HOME/openlit-secrets.env}

      # ---- AutoDev Control API proxy settings ---------------------------
      # Read by the patched Next.js server. The bearer token stays server
      # side; the browser only sees same-origin /autodev/api/* URLs. The
      # token MUST be strong — `scripts/openlit/bootstrap-secrets.sh`
      # rotates the weak `replace-me` default before compose ever starts.
      AUTODEV_CONTROL_API_URL: ${AUTODEV_CONTROL_API_URL:-http://host.docker.internal:4101}
      AUTODEV_CONTROL_API_TOKEN: ${AUTODEV_CONTROL_API_TOKEN:?AUTODEV_CONTROL_API_TOKEN must be set in the out-of-repo secret env file}
      AUTODEV_CONTROL_API_DISABLED: ${AUTODEV_CONTROL_API_DISABLED:-}

      # The read-only unified Console Usage adapter authenticates with its
      # own server-to-server credential; it does not use OpenLIT user sessions.
      AUTODEV_OPENLIT_USAGE_TOKEN: ${AUTODEV_OPENLIT_USAGE_TOKEN:?AUTODEV_OPENLIT_USAGE_TOKEN must be set in the out-of-repo secret env file}

    ports:
      - "127.0.0.1:${PORT:-3000}:3000" # Local-only OpenLIT UI/control proxy
      - "127.0.0.1:4317:4317" # Authenticated OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # Authenticated OTLP HTTP receiver
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit-data:/app/client/data
      - ./assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  openlit-clickhouse:
  openlit-data:
