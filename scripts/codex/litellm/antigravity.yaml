# Codex -> LiteLLM -> local agy CLI Responses adapter.
# Authentication and quota remain owned by the Antigravity subscription.
model_list:
  - model_name: gemini-3.6-flash-high
    litellm_params:
      model: openai/gemini-3.6-flash-high
      api_base: http://127.0.0.1:4002/v1
