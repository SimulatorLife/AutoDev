name = "explorer"
description = "Read-only codebase explorer."
nickname_candidates = ["ArchitectureScout", "CodebaseFinder", "CodebaseSurveyor"]

model_provider = "local_model_router"
model = "autodev/explorer"
model_reasoning_effort = "medium"
model_reasoning_summary = "none"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" lsp"]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" cocoindex-code"]
default_tools_approval_mode = "approve"

[mcp_servers.codex_app]
enabled = false

[mcp_servers.codex_apps]
enabled = false

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true
