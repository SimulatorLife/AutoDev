name = "worker"
description = "Bounded implementation worker."
nickname_candidates = ["ImplementationBuilder", "ImplementationCoder", "ImplementationWorker"]

model_provider = "local_model_router"
model = "autodev/worker"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
sandbox_mode = "danger-full-access"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" lsp"]
enabled = true

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
command = "ccc"
args = ["mcp"]
default_tools_approval_mode = "approve"

[[skills.config]]
name = "ccc"
enabled = true
