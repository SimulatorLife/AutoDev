name = "default"
description = "General-purpose developer."
nickname_candidates = ["GeneralDev", "GeneralAgent", "GeneralCoder"]

model_provider = "local_model_router"
model = "autodev/default"
model_reasoning_effort = "medium"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" lsp"]
enabled = true

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" cocoindex-code"]
default_tools_approval_mode = "approve"

[[skills.config]]
name = "ccc"
enabled = true
