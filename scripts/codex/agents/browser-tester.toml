name = "browser-tester"
description = "Read-only Playwright tester for browser behavior, accessibility, and runtime evidence."
nickname_candidates = ["BrowserTester", "PlaywrightTester", "UiVerifier"]

model_provider = "local_model_router"
model = "autodev/browser-tester"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" lsp"]
enabled = false

[mcp_servers.playwright]
enabled = true
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" playwright"]
default_tools_approval_mode = "approve"
enabled_tools = [
  "browser_navigate",
  "browser_tabs",
  "browser_snapshot",
  "browser_take_screenshot",
  "browser_click",
  "browser_type",
  "browser_fill_form",
  "browser_press_key",
  "browser_wait_for",
  "browser_console_messages",
  "browser_network_requests",
  "browser_find",
  "browser_hover",
  "browser_select_option",
  "browser_drag",
  "browser_handle_dialog",
  "browser_resize",
  "browser_close",
]

[mcp_servers."cocoindex-code"]
enabled = false
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" cocoindex-code"]

[mcp_servers.codex_app]
enabled = false

[mcp_servers.codex_apps]
enabled = false

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = false

[[skills.config]]
name = "remove-legacy-shims"
enabled = false

[[skills.config]]
name = "code-simplification"
enabled = false

[[skills.config]]
name = "doubt-driven-development"
enabled = false

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = false

[[skills.config]]
name = "improve-codebase-architecture"
enabled = false

[[skills.config]]
name = "ccc"
enabled = false
