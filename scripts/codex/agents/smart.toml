name = "smart"
description = "Full-capability smart agent with browser, documentation, and workspace-write access."
nickname_candidates = ["SmartAgent", "FullCapabilityAgent", "GeneralSmart"]

model_provider = "local_model_router"
model = "autodev/smart"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
sandbox_mode = "danger-full-access"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" lsp"]
enabled = true

[mcp_servers.playwright]
enabled = true
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" playwright"]
default_tools_approval_mode = "approve"
enabled_tools = [
  "browser_navigate",
  "browser_tabs",
  "browser_snapshot",
  "browser_take_screenshot",
  "browser_click",
  "browser_type",
  "browser_fill_form",
  "browser_press_key",
  "browser_wait_for",
  "browser_console_messages",
  "browser_network_requests",
  "browser_find",
  "browser_hover",
  "browser_select_option",
  "browser_drag",
  "browser_handle_dialog",
  "browser_resize",
  "browser_close",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/hooks/run-autodev-mcp.sh\" cocoindex-code"]
default_tools_approval_mode = "approve"

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true
