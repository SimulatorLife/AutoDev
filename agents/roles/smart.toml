name = "smart"
description = "Full-capability smart agent with browser, documentation, and workspace-write access."
nickname_candidates = ["SmartAgent", "FullCapabilityAgent", "GeneralSmart"]

model_provider = "local_model_router"
model = "autodev/smart"
model_reasoning_summary = "none"
sandbox_mode = "danger-full-access"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
enabled = true

[mcp_servers.playwright]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "browser_navigate",
  "browser_tabs",
  "browser_snapshot",
  "browser_take_screenshot",
  "browser_click",
  "browser_type",
  "browser_fill_form",
  "browser_press_key",
  "browser_wait_for",
  "browser_console_messages",
  "browser_network_requests",
  "browser_find",
  "browser_hover",
  "browser_select_option",
  "browser_drag",
  "browser_handle_dialog",
  "browser_resize",
  "browser_close",
]

[mcp_servers.openaiDeveloperDocs]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
default_tools_approval_mode = "approve"

[tools]
web_search = true


[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true

[[skills.config]]
name = "code-simplification"
enabled = true

[[skills.config]]
name = "doubt-driven-development"
enabled = true

[[skills.config]]
name = "improve-codebase-architecture"
enabled = true

[[skills.config]]
name = "remove-legacy-shims"
enabled = true

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = true
