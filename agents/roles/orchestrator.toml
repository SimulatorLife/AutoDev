# role-kind: orchestrator
# The root turn's capability declaration. The root turn is selected by the
# autodev/orchestrator model alias and is not installed as a child role; its
# mcp_servers settings (enabled, enabled_tools, default_tools_approval_mode)
# are composed into $CODEX_HOME/config.toml by runtime/src/config/compose-user-config.ts.

[mcp_servers.filesystem]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.lsp]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
env_vars = ["HOME"]

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]
env_vars = ["HOME"]

[mcp_servers.playwright]
enabled = false

[mcp_servers.xacpx]
enabled = true
default_tools_approval_mode = "approve"

[tools]
web_search = true

[mcp_servers.commands]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "install_dependencies",
  "typecheck",
  "test",
  "lint_fix",
  "git_status",
  "git_diff",
  "git_stage",
  "git_commit"
]
env = { AUTODEV_MCP_ROLE = "orchestrator" }

[[skills.config]]
name = "orchestration"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers.context7]
enabled = false

# Documentation research belongs to the documentation roles, so the root turn
# never picks the documentation MCP servers up itself.
[mcp_servers.googleDeveloperKnowledge]
enabled = false

[[skills.config]]
name = "code-simplification"
enabled = false

[[skills.config]]
name = "diagnosing-bugs"
enabled = false

[[skills.config]]
name = "doubt-driven-development"
enabled = false

[[skills.config]]
name = "game-playtesting"
enabled = false

[[skills.config]]
name = "improve-codebase-architecture"
enabled = false

[[skills.config]]
name = "playtest-analysis"
enabled = false

[[skills.config]]
name = "remove-legacy-shims"
enabled = false

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = false

[[skills.config]]
name = "source-driven-development"
enabled = false

[[skills.config]]
name = "writing-agent-skills"
enabled = false
