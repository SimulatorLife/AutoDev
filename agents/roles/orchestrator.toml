# role-kind: orchestrator
# The root turn's capability declaration. The root turn is selected by the
# autodev/orchestrator model alias and is not installed as a child role; its
# mcp_servers settings (enabled, enabled_tools, default_tools_approval_mode)
# are composed into $CODEX_HOME/config.toml by src/config/compose-user-config.ts.
sandbox_mode = "danger-full-access"

[mcp_servers.lsp]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]

[mcp_servers.playwright]
enabled = false

[mcp_servers.autodev_spawn]
enabled = true

[mcp_servers.codex_app]
enabled = true
enabled_tools = [
  "request_user_input",
]

[tools]
web_search = true

[[skills.config]]
name = "orchestration"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers.context7]
enabled = false
