name = "playtest-analyst"
description = "Read-only reasoning analyst for recorded playtest evidence; no code/run/branch/issue-write authority."
nickname_candidates = ["PlaytestCritic", "GameplayReviewer", "PlaytestEvidenceAnalyst"]

model_provider = "local_model_router"
model = "autodev/smart"
model_reasoning_summary = "none"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

# Reuses the autodev/smart reasoning model route, but this role does not
# inherit smart's broad workspace-write/tool surface: sandbox is forced
# read-only above and every source-write-capable or delegation-capable MCP
# server below is explicitly disabled rather than assumed off.
[mcp_servers.lsp]
enabled = false

[mcp_servers.playwright]
enabled = false

[mcp_servers."cocoindex-code"]
enabled = false

[mcp_servers.codegraphcontext]
enabled = false

[mcp_servers.context7]
enabled = false

[mcp_servers.codex_app]
enabled = false

[features]
shell_tool = false
multi_agent = false
multi_agent_v2 = false
hooks = false
memories = false

[tools]
web_search = false

[shell_environment_policy]
inherit = "none"
ignore_default_excludes = false

# Runtime-hosted Playtesting MCP server, registered through RuleSync. This role
# allowlists evidence reads, code-owned metrics/compare, packet preparation,
# confirmatory and discovery review submission, and cited batch-synthesis
# submission; it has no run/branch or finding/issue-write tools.
[mcp_servers.playtest]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "playtest.listEpisodes",
  "playtest.readEpisode",
  "playtest.readWindow",
  "playtest.prepareReview",
  "playtest.metrics",
  "playtest.compare",
  "playtest.submitReview",
  "playtest.submitDiscoveryReview",
  "playtest.submitCrossSessionSynthesis",
]
env_vars = [
  "CLICKHOUSE_URL",
  "OPENLIT_DB_USER",
  "OPENLIT_DB_NAME",
  "CODEX_HOME",
  "AUTODEV_PLAYTEST_ROLE",
  "AUTODEV_PLAYTEST_WORKSPACE_ID",
  "AUTODEV_PLAYTEST_ACTOR_ID",
  "AUTODEV_PLAYTEST_TASK_ID",
  "AUTODEV_PLAYTEST_RUN_ID",
  "AUTODEV_PLAYTEST_ANALYSIS_ID",
  "AUTODEV_PLAYTEST_SELECTED_EPISODE_IDS",
  "AUTODEV_PLAYTEST_ANALYSIS_KIND",
  "AUTODEV_PLAYTEST_ANALYSIS_METRIC_AGGREGATION",
  "AUTODEV_PLAYTEST_REPOSITORY_ROOT",
  "AUTODEV_PLAYTEST_UV",
  "AUTODEV_REPO_ROOT",
  "AUTODEV_NODE_BIN",
]

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = false

[[skills.config]]
name = "remove-legacy-shims"
enabled = false

[[skills.config]]
name = "code-simplification"
enabled = false

[[skills.config]]
name = "doubt-driven-development"
enabled = false

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = false

[[skills.config]]
name = "improve-codebase-architecture"
enabled = false

[[skills.config]]
name = "ccc"
enabled = false

[[skills.config]]
name = "playtest-analysis"
enabled = true

