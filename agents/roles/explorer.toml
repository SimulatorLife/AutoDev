name = "explorer"
description = "Read-only codebase explorer."
nickname_candidates = ["ArchitectureScout", "CodebaseFinder", "CodebaseSurveyor"]

model_provider = "local_model_router"
model = "autodev/explorer"
model_reasoning_summary = "none"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.filesystem]
enabled = true
default_tools_approval_mode = "approve"
# Read-only roles get only the tools that cannot change the filesystem.
env = { AUTODEV_MCP_READ_ONLY = "1" }

[mcp_servers.lsp]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
default_tools_approval_mode = "approve"
env_vars = ["HOME"]

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]
env_vars = ["HOME"]

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true

[mcp_servers.context7]
enabled = true

[[skills.config]]
name = "code-simplification"
enabled = false

[[skills.config]]
name = "diagnosing-bugs"
enabled = false

[[skills.config]]
name = "doubt-driven-development"
enabled = false

[[skills.config]]
name = "game-playtesting"
enabled = false

[[skills.config]]
name = "improve-codebase-architecture"
enabled = false

[[skills.config]]
name = "playtest-analysis"
enabled = false

[[skills.config]]
name = "remove-legacy-shims"
enabled = false

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = false

[[skills.config]]
name = "source-driven-development"
enabled = false

[[skills.config]]
name = "writing-agent-skills"
enabled = false
