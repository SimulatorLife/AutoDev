name = "explorer"
description = "Read-only codebase explorer."
nickname_candidates = ["ArchitectureScout", "CodebaseFinder", "CodebaseSurveyor"]

model_provider = "local_model_router"
model = "autodev/explorer"
model_reasoning_summary = "none"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "add_code_to_graph",
  "check_job_status",
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[[skills.config]]
name = "ccc"
enabled = true

[mcp_servers.context7]
enabled = true
