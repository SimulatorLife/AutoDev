name = "playtester"
description = "Bounded game-playtesting executor; read-only for source code, no code/issue writes."
nickname_candidates = ["PlaytestRunner", "GameplaySampler", "PlaytestExecutor"]

model_provider = "local_model_router"
model = "autodev/playtester"
sandbox_mode = "read-only"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
enabled = false

[mcp_servers.playwright]
enabled = false

[mcp_servers."cocoindex-code"]
enabled = false

[mcp_servers.codegraphcontext]
enabled = false

[mcp_servers.context7]
enabled = false

[mcp_servers.autodev_spawn]
enabled = false

[mcp_servers.codex_app]
enabled = false

# Planned Runtime-hosted playtesting MCP server (runtime/src/playtesting/mcp.ts,
# registered in .rulesync/mcp.jsonc by the owning change). This role allowlists
# only the run/result-read commands; it never gets evidence-review, compare, or
# findings-write commands, which belong to playtest-analyst and root.
[mcp_servers.playtest]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "playtest.capabilities",
  "playtest.run",
  "playtest.listEpisodes",
  "playtest.readEpisode",
  "playtest.readWindow",
]

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = false

[[skills.config]]
name = "remove-legacy-shims"
enabled = false

[[skills.config]]
name = "code-simplification"
enabled = false

[[skills.config]]
name = "doubt-driven-development"
enabled = false

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = false

[[skills.config]]
name = "improve-codebase-architecture"
enabled = false

[[skills.config]]
name = "ccc"
enabled = false

[[skills.config]]
name = "game-playtesting"
enabled = true

