name = "worker"
description = "Bounded implementation worker."
nickname_candidates = ["ImplementationBuilder", "ImplementationCoder", "ImplementationWorker"]

model_provider = "local_model_router"
model = "autodev/worker"
model_reasoning_summary = "none"
sandbox_mode = "danger-full-access"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.lsp]
enabled = true

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "add_code_to_graph",
  "check_job_status",
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]

[[skills.config]]
name = "ccc"
enabled = true

[[skills.config]]
name = "code-simplification"
enabled = true

[[skills.config]]
name = "diagnosing-bugs"
enabled = true

[[skills.config]]
name = "doubt-driven-development"
enabled = true

[[skills.config]]
name = "improve-codebase-architecture"
enabled = true

[[skills.config]]
name = "remove-legacy-shims"
enabled = true

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = true
