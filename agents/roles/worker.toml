name = "worker"
description = "Bounded implementation worker."
nickname_candidates = ["ImplementationBuilder", "ImplementationCoder", "ImplementationWorker"]

model_provider = "local_model_router"
model = "autodev/worker"
model_reasoning_summary = "none"

developer_instructions = """
{{AUTODEV_BASE_PROMPT}}

{{AUTODEV_LEAF_PROMPT}}

{{AUTODEV_CODE_SEARCH_PROMPT}}

{{AUTODEV_ROLE_PROMPT}}
"""

[mcp_servers.filesystem]
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.lsp]
enabled = true
enabled_tools = [
  "lsp_find_symbol",
  "lsp_smart_search",
  "lsp_goto_definition",
  "lsp_goto_type_definition",
  "lsp_find_references",
  "lsp_find_implementations",
  "lsp_type_hierarchy",
  "lsp_hover",
  "lsp_signature_help",
  "lsp_document_symbols",
  "lsp_diagnostics",
  "lsp_index_files",
  "lsp_workspace_diagnostics",
  "lsp_rename",
  "lsp_code_actions",
  "lsp_format_document",
]

[mcp_servers.commands]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "install_dependencies",
  "typecheck",
  "test",
  "lint_fix",
  "git_status",
  "git_diff",
  "git_stage",
  "git_commit"
]
env = { AUTODEV_MCP_ROLE = "worker" }

[[skills.config]]
name = "orchestration"
enabled = false

[[skills.config]]
name = "lsp-mcp-server"
enabled = true

[mcp_servers."cocoindex-code"]
enabled = true
default_tools_approval_mode = "approve"
env_vars = ["HOME"]

[mcp_servers.codegraphcontext]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "list_indexed_repositories",
  "find_code",
  "analyze_code_relationships",
  "get_repository_stats",
]
env_vars = ["HOME"]

[[skills.config]]
name = "ccc"
enabled = true

[[skills.config]]
name = "code-simplification"
enabled = true

[[skills.config]]
name = "diagnosing-bugs"
enabled = true

[[skills.config]]
name = "doubt-driven-development"
enabled = true

[[skills.config]]
name = "improve-codebase-architecture"
enabled = true

[[skills.config]]
name = "remove-legacy-shims"
enabled = true

[[skills.config]]
name = "resolve-merge-conflicts"
enabled = true

[[skills.config]]
name = "game-playtesting"
enabled = false

[[skills.config]]
name = "playtest-analysis"
enabled = false

[[skills.config]]
name = "source-driven-development"
enabled = false

[[skills.config]]
name = "writing-agent-skills"
enabled = false
