name: "Temporary OpenCLI PR verification"

on:
  push:
    branches:
      - fix/opencli-tool-lifecycle-and-streaming-20261119
    paths:
      - ".github/workflows/opencli-verify-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint:ci
      - name: Typecheck
        run: pnpm run typecheck:root
      - name: OpenCLI provider regression tests
        run: node --import ./runtime/tests/support/isolate-autodev-state.ts --test tests/providers/opencli-upstream.test.ts tests/providers/opencli.test.ts
