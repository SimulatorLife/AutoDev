name: '▶️ MiniMax Invoke'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target pull request number in target_repository."
        required: true
        type: string
      target_repository:
        description: "Target repository."
          required: true
          type: choice
          options:
            - SimulatorLife/3DSpider
            - SimulatorLife/AutoDev
            - SimulatorLife/Colourful-Life
            - SimulatorLife/GMLoop
            - SimulatorLife/RacingGame
permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ inputs.pr_number }}
      target_repository: ${{ inputs.target_repository }}
      additional_context: ""
      agent: mini-max
      openai_base_url: 'https://api.minimax.io/v1'
      agent_command: |
        set -euo pipefail

        set +e
        stdbuf -oL -eL npx --yes @qwen-code/qwen-code@latest \
          --approval-mode=yolo \
          --auth-type openai \
          --openai-api-key "${OPENAI_API_KEY}" \
          --openai-base-url "${OPENAI_BASE_URL}" \
          --model=MiniMax-M3 \
          --experimental-lsp \
          --output-format=stream-json \
          --prompt "" < "${AGENT_PROMPT_FILE}" \
          2>&1 | tee "$RUNNER_TEMP/agent-stream.jsonl"
        agent_status="${PIPESTATUS[0]}"
        set -e

        if [ "${agent_status}" -ne 0 ]; then
          exit "${agent_status}"
        fi
