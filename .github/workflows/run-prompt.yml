name: "Run Prompt"

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Target repository."
        required: true
        type: choice
        options:
          - SimulatorLife/3DSpider
          - SimulatorLife/AutoDev
          - SimulatorLife/Colourful-Life
          - SimulatorLife/GMLoop
          - SimulatorLife/RacingGame
      prompt_repository:
        description: "Repository that owns the prompt."
        required: true
        type: choice
        options:
          - SimulatorLife/3DSpider
          - SimulatorLife/AutoDev
          - SimulatorLife/Colourful-Life
          - SimulatorLife/GMLoop
          - SimulatorLife/RacingGame
      prompt_path:
        description: "Markdown prompt under .agents/prompts/."
        required: true
        type: string
      base_branch:
        description: "Target base branch."
        required: false
        default: "main"
        type: string
      prompt_title:
        description: "Optional PR title."
        required: false
        default: "Agent: Apply repository prompt"
        type: string
      agent:
        description: "Optional provider/agent override."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  run:
    uses: ./.github/workflows/_agent-open-pr-and-ping.yml
    secrets: inherit
    with:
      target_repository: ${{ inputs.target_repository }}
      base_branch: ${{ inputs.base_branch }}
      prompt_path: ${{ inputs.prompt_path }}
      prompt_repository: ${{ inputs.prompt_repository }}
      prompt: ""
      agent: ${{ inputs.agent }}
      pr_title: ${{ inputs.prompt_title }}
