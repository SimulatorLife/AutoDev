name: "Rulesync Shared Shadow Drift"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "tests/fixtures/rulesync-shadow/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rulesync-mcp-shadow-drift.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
  pull_request:
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "tests/fixtures/rulesync-shadow/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rulesync-mcp-shadow-drift.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"

permissions:
  contents: read

jobs:
  rulesync-shared-shadow-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AutoDev dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Rulesync drift against tracked shadow fixtures
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          mkdir -p "$temp_root/input"
          cp -R .rulesync/. "$temp_root/input/"
          {
            printf '%s\n' '---' 'root: true' 'targets: ["*"]' 'description: "AutoDev shared workspace instructions for all AI tooling"' 'globs: ["**/*"]' '---'
            cat .rulesync/rules/overview.md
          } > "$temp_root/input/rules/overview.md"
          pnpm exec rulesync generate \
            --input-roots "$temp_root/input" \
            --targets codexcli,claudecode,copilot,antigravity-cli \
            --features mcp,rules,skills,hooks \
            --output-roots tests/fixtures/rulesync-shadow \
            --check \
            --silent

      - name: Check live Copilot skills from an ephemeral Rulesync output root
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          pnpm exec rulesync generate \
            --input-roots .rulesync \
            --targets copilot \
            --features skills \
            --output-roots "$temp_root/generated" \
            --delete \
            --silent
          pnpm exec rulesync generate \
            --input-roots .rulesync \
            --targets copilot \
            --features skills \
            --output-roots "$temp_root/generated" \
            --check \
            --silent
          python3 - "$temp_root/generated" .github/skills <<'PY'
          from pathlib import Path
          import sys

          generated, live = map(Path, sys.argv[1:])
          skills = ("ccc", "lsp-mcp-server", "orchestration")
          expected = {Path(name) / "SKILL.md" for name in skills}
          actual = {
              path.relative_to(live)
              for path in live.rglob("*")
              if path.is_file()
          }
          if actual != expected:
              raise SystemExit(f"unexpected live Copilot skill files: {sorted(actual)}")
          for skill in skills:
              relative = Path(skill) / "SKILL.md"
              output = generated / ".github" / "skills" / relative
              if output.read_bytes() != (live / relative).read_bytes():
                  raise SystemExit(f"live Copilot skill drift: {relative}")
          PY

      - name: Check live rules from an ephemeral Rulesync input root
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          mkdir -p "$temp_root/input/rules" "$temp_root/live/.github"
          {
            printf '%s\n' '---' 'root: true' 'targets: ["*"]' 'description: "AutoDev shared workspace instructions for all AI tooling"' 'globs: ["**/*"]' '---'
            cat .rulesync/rules/overview.md
          } > "$temp_root/input/rules/overview.md"
          cp AGENTS.md "$temp_root/live/AGENTS.md"
          cp CLAUDE.md "$temp_root/live/CLAUDE.md"
          cp .github/copilot-instructions.md "$temp_root/live/.github/copilot-instructions.md"
          pnpm exec rulesync generate \
            --input-roots "$temp_root/input" \
            --targets codexcli,claudecode,copilot,antigravity-cli \
            --features rules \
            --output-roots "$temp_root/generated" \
            --delete \
            --silent
          pnpm exec rulesync generate \
            --input-roots "$temp_root/input" \
            --targets codexcli,claudecode,copilot,antigravity-cli \
            --features rules \
            --output-roots "$temp_root/generated" \
            --check \
            --silent
          python3 - "$temp_root/generated" "$temp_root/live" <<'PY'
          from pathlib import Path
          import sys

          generated, live = map(Path, sys.argv[1:])
          paths = ("AGENTS.md", "CLAUDE.md", ".github/copilot-instructions.md")
          for relative in paths:
              output = generated / relative
              normalized = output.read_bytes().removesuffix(b"\n")
              output.write_bytes(normalized)
              if normalized != (live / relative).read_bytes():
                  raise SystemExit(f"live rule drift: {relative}")
          PY
