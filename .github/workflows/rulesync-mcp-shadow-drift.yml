name: "Rulesync Shared Shadow Drift"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "tests/test_rulesync_*.py"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rulesync-mcp-shadow-drift.yml"
  pull_request:
    paths:
      - ".rulesync/**"
      - "rulesync.jsonc"
      - "tests/test_rulesync_*.py"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rulesync-mcp-shadow-drift.yml"

permissions:
  contents: read

jobs:
  rulesync-shared-shadow-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AutoDev dependencies
        run: pnpm install --frozen-lockfile

      # Nothing Rulesync generates is tracked as a fixture. Every suite generates
      # its projections from `.rulesync` into temporary roots with the pinned
      # Rulesync and asserts them, so the canonical source stays the only copy.
      - name: Check Rulesync projections generated from the canonical source
        run: python3 -m unittest tests/test_rulesync_*.py
