name: "Target Validation"

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Target repository."
        required: true
        type: choice
        options:
          - SimulatorLife/3DSpider
          - SimulatorLife/AutoDev
          - SimulatorLife/Colourful-Life
          - SimulatorLife/GMLoop
          - SimulatorLife/RacingGame
      target_sha:
        description: "Fallback target commit to validate."
        required: true
        type: string
      pr_number:
        description: "Optional target PR number; current head is resolved when supplied."
        required: false
        default: ""
        type: string
      run_browser:
        description: "Run optional browser commands from the profile."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  resolve_target:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Resolve current target PR head
        id: resolve
        uses: actions/github-script@v8
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ secrets.GH_USER_TOKEN }}
          script: |
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            let sha = process.env.TARGET_SHA;
            if (process.env.PR_NUMBER) {
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
              sha = pull.head.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Unable to resolve a full target commit SHA.');
            core.setOutput('target_sha', sha);
            core.info(`Validating ${process.env.TARGET_REPOSITORY} at ${sha}.`);

  validate:
    needs: resolve_target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ needs.resolve_target.outputs.target_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Checkout AutoDev validation profiles
        uses: actions/checkout@v6
        with:
          path: .autodev
          fetch-depth: 1

      - name: Stage target validation profile
        id: profile
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          cp .autodev/.nvmrc "$RUNNER_TEMP/autodev.nvmrc"
          jq -e --arg repo "$TARGET_REPOSITORY" '.[$repo]' .autodev/.github/ci/validation-profiles.json > "$RUNNER_TEMP/profile.json"
          echo "package_manager=$(jq -r '.packageManager' "$RUNNER_TEMP/profile.json")" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=$(jq -r '.pnpmVersion // empty' "$RUNNER_TEMP/profile.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout private target through AutoDev PAT
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ needs.resolve_target.outputs.target_sha }}
          token: ${{ secrets.GH_USER_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        if: ${{ steps.profile.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.profile.outputs.pnpm_version }}
          cache: false

      - name: Setup Node.js
        if: ${{ steps.profile.outputs.package_manager != 'none' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: ../../_temp/autodev.nvmrc

      - name: Install target dependencies
        id: dependencies
        if: ${{ steps.profile.outputs.package_manager != 'none' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          install_command="$(jq -r '.install // empty' "$RUNNER_TEMP/profile.json")"
          if [ -n "$install_command" ]; then bash -lc "$install_command"; else echo "No install command configured."; fi

      - name: Run required target validation commands
        id: required
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          commands="$(jq -c '.commands // []' "$RUNNER_TEMP/profile.json")"
          count="$(jq 'length' <<<"$commands")"
          if [ "$count" -eq 0 ]; then echo "No required validation commands are configured for this target." >&2; exit 1; fi
          failed=0
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            command="$(jq -r '.run' <<<"$item")"
            echo "::group::$name"
            if ! bash -lc "$command"; then failed=1; fi
            echo "::endgroup::"
          done < <(jq -c '.[]' <<<"$commands")
          exit "$failed"

      - name: Run optional target validation commands
        id: optional
        if: ${{ inputs.run_browser == true }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            command="$(jq -r '.run' <<<"$item")"
            echo "::group::$name"
            if ! bash -lc "$command"; then failed=1; fi
            echo "::endgroup::"
          done < <(jq -c '.optionalCommands // []' "$RUNNER_TEMP/profile.json")
          exit "$failed"

      - name: Publish target validation status
        if: always()
        uses: actions/github-script@v8
        env:
          PROFILE_EXISTS: ${{ steps.profile.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome || 'skipped' }}
          REQUIRED: ${{ steps.required.outcome }}
          OPTIONAL: ${{ steps.optional.outcome || 'skipped' }}
        with:
          github-token: ${{ secrets.GH_USER_TOKEN }}
          script: |
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            const outcomes = {
              profile: process.env.PROFILE_EXISTS,
              dependencies: process.env.DEPENDENCIES,
              required: process.env.REQUIRED,
              optional: process.env.OPTIONAL,
            };
            const passed = outcomes.profile === 'success' && outcomes.required === 'success' && ['success', 'skipped'].includes(outcomes.dependencies) && ['success', 'skipped'].includes(outcomes.optional);
            const description = Object.entries(outcomes).map(([name, value]) => `${name}=${value}`).join(', ').slice(0, 140);
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({ owner, repo, sha: process.env.TARGET_SHA, state: passed ? 'success' : 'failure', context: 'autodev/validation', description, target_url: targetUrl });
            const prNumber = Number(process.env.PR_NUMBER || 0);
            if (prNumber > 0) {
              const marker = '<!-- autodev-target-validation -->';
              const body = `${marker}\nAutoDev validation for ${process.env.TARGET_REPOSITORY} at ${process.env.TARGET_SHA}: **${passed ? 'passed' : 'failed'}**.\n\n${description}\n\n[View AutoDev validation run](${targetUrl})`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
              const existing = comments.find((comment) => comment.body?.includes(marker));
              if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
            if (!passed) core.setFailed(`Target validation failed: ${description}`);
