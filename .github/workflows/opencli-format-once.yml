name: "Temporary OpenCLI PR formatter"

on:
  push:
    branches:
      - fix/opencli-tool-lifecycle-and-streaming-20261119
    paths:
      - ".github/workflows/opencli-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format changed OpenCLI TypeScript with pinned Prettier
        run: |
          pnpm exec prettier --write \
            runtime/src/providers/opencli.ts \
            runtime/src/providers/opencli-turn.ts \
            tests/providers/opencli.test.ts \
            tests/providers/opencli-upstream.test.ts
      - name: Commit formatting only on this review branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
            runtime/src/providers/opencli.ts \
            runtime/src/providers/opencli-turn.ts \
            tests/providers/opencli.test.ts \
            tests/providers/opencli-upstream.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              runtime/src/providers/opencli.ts \
              runtime/src/providers/opencli-turn.ts \
              tests/providers/opencli.test.ts \
              tests/providers/opencli-upstream.test.ts
            git commit -m "style(opencli): apply pinned Prettier to PR files"
            git push origin HEAD:fix/opencli-tool-lifecycle-and-streaming-20261119
          fi
