name: '▶️ Gemini Invoke'
run-name: Agent invoke — ${{ inputs.target_repository || github.repository }} PR #${{ inputs.pr_number || github.event.issue.number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target pull request number in target_repository."
        required: true
        type: string
      target_repository:
        description: "Target repository."
        required: true
        type: choice
        options:
          - SimulatorLife/3DSpider
          - SimulatorLife/AutoDev
          - SimulatorLife/Colourful-Life
          - SimulatorLife/GMLoop
          - SimulatorLife/RacingGame
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.target_repository || github.repository }}-${{ inputs.pr_number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body || '', '@gemini')) }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ inputs.pr_number || github.event.issue.number }}
      target_repository: ${{ inputs.target_repository || github.repository }}
      additional_context: ${{ github.event.comment.body }}
      agent: gemini
      openai_base_url: 'https://generativelanguage.googleapis.com'
      agent_setup_command: |
        mkdir -p "$HOME/.gemini/policies"
        if [ -f ".gemini/policies/tools.toml" ]; then
          cp ".gemini/policies/tools.toml" "$HOME/.gemini/policies/tools.toml"
        else
          echo "❌ Missing .gemini/policies/tools.toml"
          exit 1
        fi
      agent_command: |
        set -euo pipefail

        export GEMINI_CLI_TRUST_WORKSPACE=true
        export GEMINI_API_KEY="${OPENAI_API_KEY}"
        export NODE_OPTIONS="--max-old-space-size=4096"

        set +e
        stdbuf -oL -eL pnpm --silent dlx @google/gemini-cli@latest \
          --approval-mode=yolo \
          --policy="$HOME/.gemini/policies" \
          --output-format=stream-json \
          --skip-trust \
          --prompt "" < "${AGENT_PROMPT_FILE}" 2>&1 | tee "$RUNNER_TEMP/agent-stream.jsonl"
        agent_status="${PIPESTATUS[0]}"
        set -e

        if [ "${agent_status}" -ne 0 ]; then
          exit "${agent_status}"
        fi
