name: '▶️ MiniMax Codex Invoke'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target pull request number in target_repository."
        required: true
        type: string
      target_repository:
        description: "Target repository."
        required: true
        type: choice
        options:
          - SimulatorLife/3DSpider
          - SimulatorLife/AutoDev
          - SimulatorLife/Colourful-Life
          - SimulatorLife/GMLoop
          - SimulatorLife/RacingGame
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.target_repository || github.repository }}-${{ inputs.pr_number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && contains(github.event.comment.body || '', '@mini-max-codex')) }}
    uses: ./.github/workflows/agent-invoke.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    with:
      pr_number: ${{ inputs.pr_number || github.event.issue.number }}
      target_repository: ${{ inputs.target_repository || github.repository }}
      additional_context: ${{ github.event.comment.body }}
      openai_base_url: 'https://api.minimax.io/v1'
      agent: mini-max-codex
      agent_command: |
        set -euo pipefail

        set +e
        stdbuf -oL -eL pnpm --silent dlx @openai/codex@0.80.0 exec \
          --profile=minimax \
          --json \
          - < "${AGENT_PROMPT_FILE}" \
          2>&1 | tee "$RUNNER_TEMP/agent-stream.jsonl"
        agent_status="${PIPESTATUS[0]}"
        set -e

        if [ "${agent_status}" -ne 0 ]; then
          exit "${agent_status}"
        fi
