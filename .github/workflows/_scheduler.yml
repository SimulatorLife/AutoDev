name: "scheduler"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  plan-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoDev policy
        uses: actions/checkout@v6

      - name: Load routing configuration
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/weights.json
          echo "cfg=$(jq -c . .github/workflows/weights.json)" >> "$GITHUB_OUTPUT"

      - name: Compute dispatch plan
        id: plan
        uses: actions/github-script@v8
        env:
          CFG_JSON: ${{ steps.cfg.outputs.cfg }}
        with:
          script: |
            const cfg = JSON.parse(process.env.CFG_JSON || '{}');
            const WEIGHT_SCALE = 1000;
            const CATEGORIES = new Set(['code', 'merging', 'regressions']);

            const finite = (value, label) => {
              const number = Number(value);
              if (!Number.isFinite(number)) throw new Error(`${label} must be finite.`);
              return number;
            };
            const integer = (value, label) => {
              const number = Number(value);
              if (!Number.isInteger(number)) throw new Error(`${label} must be an integer.`);
              return number;
            };
            const uniqueNames = (items, label) => {
              const seen = new Set();
              for (const item of items) {
                if (seen.has(item.name)) throw new Error(`${label} names must be unique: ${item.name}`);
                seen.add(item.name);
              }
            };
            const slots = (weight) => Math.max(1, Math.round(weight * WEIGHT_SCALE));

            const choose = (items, runNumber) => {
              const sorted = [...items].sort((left, right) => left.sortKey.localeCompare(right.sortKey));
              const maxSlots = Math.max(...sorted.map((item) => item.slots), 0);
              const cycle = [];
              for (let slot = 1; slot <= maxSlots; slot += 1) {
                for (const item of sorted) if (item.slots >= slot) cycle.push(item);
              }
              if (cycle.length === 0) return null;
              const index = (runNumber - 1) % cycle.length;
              return { selected: cycle[index], index, length: cycle.length };
            };

            const agents = (cfg.agents || []).map((raw, index) => {
              const name = typeof raw?.name === 'string' ? raw.name.trim() : '';
              if (!name) throw new Error(`agents[${index}].name is required.`);
              const weight = finite(raw.weight, `agents[${index}].weight`);
              const cadenceTicks = raw.cadenceTicks === undefined ? 1 : integer(raw.cadenceTicks, `agents[${index}].cadenceTicks`);
              if (cadenceTicks <= 0) throw new Error(`agents[${index}].cadenceTicks must be positive.`);
              const category = Array.isArray(raw.category) ? raw.category : [];
              if (category.length === 0 || category.some((value) => !CATEGORIES.has(value))) {
                throw new Error(`agents[${index}].category is invalid.`);
              }
              return { name, weight, cadenceTicks, category, minComplexity: raw.minComplexity, maxComplexity: raw.maxComplexity };
            });
            uniqueNames(agents, 'Agent');

            const prompts = (cfg.prompts || []).map((raw, index) => {
              const name = typeof raw?.name === 'string' ? raw.name.trim() : '';
              const path = typeof raw?.path === 'string' ? raw.path.trim() : '';
              const promptRepository = typeof raw?.promptRepository === 'string' ? raw.promptRepository.trim() : '';
              const title = typeof raw?.title === 'string' && raw.title.trim() ? raw.title.trim() : `Agent: ${name}`;
              if (!name || !/^\.agents\/prompts\/[^/]+\.md$/.test(path)) throw new Error(`prompts[${index}] must define a safe Markdown path.`);
              if (!/^[^/\s]+\/[^/\s]+$/.test(promptRepository)) throw new Error(`prompts[${index}].promptRepository must use owner/name.`);
              const category = raw?.category;
              if (!CATEGORIES.has(category)) throw new Error(`prompts[${index}].category is invalid.`);
              const complexity = integer(raw.complexity, `prompts[${index}].complexity`);
              if (complexity < 1 || complexity > 3) throw new Error(`prompts[${index}].complexity must be 1..3.`);
              return { name, path, promptRepository, title, category, complexity, weight: finite(raw.weight, `prompts[${index}].weight`) };
            });
            uniqueNames(prompts, 'Prompt');

            const repositories = (cfg.repositories || []).map((raw, index) => {
              const name = typeof raw?.name === 'string' ? raw.name.trim() : '';
              if (!/^[^/\s]+\/[^/\s]+$/.test(name)) throw new Error(`repositories[${index}].name must use owner/name.`);
              const baseBranch = typeof raw.baseBranch === 'string' && raw.baseBranch.trim() ? raw.baseBranch.trim() : 'main';
              return { name, baseBranch, weight: finite(raw.weight, `repositories[${index}].weight`) };
            });
            uniqueNames(repositories, 'Repository');

            const runNumber = Math.max(1, Number.parseInt(process.env.GITHUB_RUN_NUMBER || '1', 10));
            const candidates = [];
            for (const agent of agents) {
              if (runNumber % agent.cadenceTicks !== 0 || agent.weight <= 0) continue;
              for (const prompt of prompts) {
                if (prompt.weight <= 0 || !agent.category.includes(prompt.category)) continue;
                if (agent.minComplexity !== undefined && prompt.complexity < agent.minComplexity) continue;
                if (agent.maxComplexity !== undefined && prompt.complexity > agent.maxComplexity) continue;
                for (const repository of repositories) {
                  if (repository.weight <= 0) continue;
                  const weight = agent.weight * prompt.weight * repository.weight;
                  if (!Number.isFinite(weight) || weight <= 0) continue;
                  candidates.push({
                    agentName: agent.name,
                    promptName: prompt.name,
                    promptPath: prompt.path,
                    promptRepository: prompt.promptRepository,
                    promptTitle: prompt.title,
                    targetRepository: repository.name,
                    baseBranch: repository.baseBranch,
                    weight,
                    slots: slots(weight),
                    sortKey: `${prompt.name}::${repository.name}::${agent.name}`.toLowerCase(),
                  });
                }
              }
            }

            const chosen = choose(candidates, runNumber);
            if (!chosen) {
              core.info(`No positive scheduled candidates for run #${runNumber}.`);
              return null;
            }
            const item = chosen.selected;
            core.info(`Selected ${item.promptName} for ${item.targetRepository} with ${item.agentName} at ${chosen.index + 1}/${chosen.length}.`);
            return {
              workflow_id: 'run-prompt.yml',
              agent_name: item.agentName,
              prompt_path: item.promptPath,
              prompt_repository: item.promptRepository,
              prompt_title: item.promptTitle,
              target_repository: item.targetRepository,
              base_branch: item.baseBranch,
            };

      - name: Dispatch prompt runner
        if: ${{ steps.plan.outputs.result != '' }}
        uses: actions/github-script@v8
        env:
          PLAN_RESULT: ${{ steps.plan.outputs.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const plan = JSON.parse(process.env.PLAN_RESULT || 'null');
            if (!plan?.target_repository || !plan?.prompt_path || !plan?.agent_name) return;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: plan.workflow_id,
              ref: (context.ref || 'refs/heads/main').replace(/^refs\/(heads|tags)\//, ''),
              inputs: {
                target_repository: plan.target_repository,
                base_branch: plan.base_branch,
                prompt_repository: plan.prompt_repository,
                prompt_path: plan.prompt_path,
                prompt_title: plan.prompt_title,
                agent: plan.agent_name,
              },
            });
            core.info(`Dispatched ${plan.prompt_path} for ${plan.target_repository}.`);
