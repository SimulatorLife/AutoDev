name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - ".agents/prompts/**"
      - ".github/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".agents/prompts/**"
      - ".github/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AutoDev dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AutoDev tests
        run: |
          pnpm test
          pnpm run test:python

      - name: Validate provider scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do bash -n "$file"; done < <(find scripts -type f -name '*.sh' -print)
          while IFS= read -r file; do node --check "$file"; done < <(find scripts -type f -name '*.mjs' -print)
          python3 -m py_compile scripts/*.py
