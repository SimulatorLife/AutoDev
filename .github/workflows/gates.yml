name: "Gates"

# The migration gate the target state asks for: current-main CI/workflow
# evidence that the monorepo's acceptance gates hold. Without a workflow that
# runs them on main, the gates are a claim anybody can make and nobody can
# check.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # AutoDev is a macOS product: its services are launchd jobs, its installer
    # writes LaunchAgents, and the platform suite asserts that supervision
    # contract. The gate runs where the product runs, so those assertions are
    # measured instead of skipped.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AutoDev dependencies
        run: pnpm install --frozen-lockfile

      # The playtesting statistics worker is a Python program the Runtime
      # starts through `uv`. The repository pins its lockfile and the Runtime
      # refuses to analyze with a drifted one, so a runner without `uv` is a
      # runner that cannot run the product's own analysis at all.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      # The visual browser driver drives a Playwright Chromium. Without one the
      # driver reports itself unavailable, and the suites that measure it
      # measure a machine that has no browser rather than a product that
      # works.
      - name: Install the browser the visual driver needs
        working-directory: runtime
        run: pnpm exec playwright-core install --with-deps chromium

      # The four gates, in the order that fails fastest. Formatting first
      # because it is a second, and the slowest gate is the test suite.
      #
      # Every gate runs even when an earlier one has failed. This workflow is
      # the evidence the migration gate is read against, and evidence that
      # stops at the first failure is evidence about one gate.
      - name: Check formatting
        if: always()
        run: pnpm format:check

      - name: Lint
        if: always()
        run: pnpm lint:ci

      - name: Typecheck
        if: always()
        run: pnpm typecheck

      # The root suite and every workspace suite. `--workspace-concurrency=1`
      # is the repository's own choice: the suites share temporary roots, and
      # running them at once has them collide.
      - name: Test
        if: always()
        run: pnpm test

  sandbox:
    # The playtesting sandbox runs an approved container, and a container needs
    # a daemon. A macOS runner has no Docker daemon, so the sandbox contract
    # cannot be measured there: the suite fails on the missing socket rather
    # than on the sandbox. It is measured here, where a daemon exists, rather
    # than skipped where one does not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AutoDev dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the container sandbox
        working-directory: runtime
        run: >-
          node --test
          tests/playtesting-docker-sandbox.test.ts
          tests/playtesting-generic-adapter-episode.test.ts
